version: 2

models:
  - name: stg_jolpica__races
    description: >
      One row per race, 1950 to present. Calendar, circuit and the scheduled
      start of each session on the weekend.
    columns:
      - name: season
        description: Championship season the race belongs to.
        data_tests: [not_null]
      - name: round
        description: Round number within the season, 1-based.
        data_tests: [not_null]
      - name: race_date
        description: Date the race was held.
        data_tests: [not_null]
      - name: race_start_utc
        description: >
          Scheduled race start. Null before roughly 1960 -- the source carries a
          date but no time for early seasons.
      - name: circuit_id
        description: Stable circuit slug, e.g. `monza`.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, round]

  - name: stg_jolpica__results
    description: >
      One row per driver per car per race.

      Not per driver per race: car sharing was legal until 1958 and drivers took
      over teammates' cars into the mid-1960s, so a driver can hold two result
      rows for one race. At Monza in 1950 Ascari retired car 16 with engine
      failure, took over car 48 and finished second. 83 such pairs exist, none
      after 1964. The reverse also happens -- 130 cars were shared by two
      drivers -- so neither the driver nor the car alone identifies a row.

      Race-level attributes are deliberately absent here: a race can straddle
      two raw pages, so those belong to stg_jolpica__races.
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: driver_id
        description: Stable driver slug, e.g. `max_verstappen`.
        data_tests: [not_null]
      - name: constructor_id
        description: Stable constructor slug, e.g. `red_bull`.
        data_tests: [not_null]
      - name: car_number
        description: >
          Car number, part of the grain because of shared drives. Null for six
          rows between 1961 and 1963 where the source records the string 'None'.
          Warns rather than fails: it is a known defect in the source, and the
          raw layer still holds the original, but it should stay visible in
          every build rather than being quietly tolerated.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: finish_position
        description: Numeric finishing order, including retirements.
      - name: finish_position_text
        description: >
          Classification code where one applies: R retired, D disqualified,
          E excluded, W withdrawn, N not classified. Otherwise the position.
        data_tests: [not_null]
      - name: points
        description: >
          Championship points. Double rather than integer -- shortened 1950s
          races awarded half points, and shared drives split them further.
        data_tests: [not_null]
      - name: fastest_lap_seconds
        description: >
          Fastest lap in seconds, parsed from the source's `M:SS.mmm` string.
          Null before roughly 2004, when the source began recording it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, round, driver_id, car_number]

  - name: stg_jolpica__qualifying
    description: >
      One row per driver per qualifying session, 1994 onwards. Earlier seasons
      have no qualifying data in the source at all.
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: driver_id
        data_tests: [not_null]
      - name: qualifying_position
        description: Grid order set by qualifying, before any penalties.
      - name: q1_seconds
        description: >
          Q1 time in seconds. Null both for drivers who set no time and for the
          pre-2006 formats, which recorded a position but no segment times.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, round, driver_id]

  - name: stg_jolpica__drivers
    description: >
      One row per driver per season -- the grain the source publishes. A driver
      spanning fifteen seasons appears fifteen times.
    columns:
      - name: season
        data_tests: [not_null]
      - name: driver_id
        data_tests: [not_null]
      - name: full_name
        data_tests: [not_null]
      - name: driver_code
        description: >
          Three-letter broadcast code. Null for most of the sport's history --
          codes only appear from the 1990s.
      - name: permanent_number
        description: Career number. Null before 2014, when they were introduced.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, driver_id]

  - name: stg_jolpica__driver_standings
    description: >
      One row per driver per season: the final drivers' championship
      classification as published, not recomputed from results.

      Championship points and points scored are different numbers before 1991,
      when only a driver's best N results counted toward the title. Use this
      model for anything that ranks drivers in a championship; use
      stg_jolpica__results for anything about points actually scored in a race.
    columns:
      - name: season
        data_tests: [not_null]
      - name: driver_id
        data_tests: [not_null]
      - name: championship_position
        description: >
          Final classification, 1 being the champion. Null where the entrant has
          no classified position: 1,463 rows where the driver scored no points
          and the source records '-', and one 1997 row where Michael Schumacher
          was disqualified from the championship for the collision with
          Villeneuve at Jerez, recorded as 'D'. Not null-tested for that reason
          -- see championship_position_text, which is always populated.
      - name: championship_position_text
        description: >
          Classification as published: a number, '-' for unclassified, or 'D'
          for a disqualification from the championship.
        data_tests: [not_null]
      - name: championship_points
        description: >
          Points counting toward the title. Not the sum of points scored in
          each race for seasons between 1950 and 1990.
        data_tests: [not_null]
      - name: wins
        data_tests: [not_null]
      - name: constructor_ids
        description: >
          Constructors the driver represented that season, as an array. A driver
          who changed teams mid-season has more than one; exploding them here
          would break the grain.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, driver_id]

  - name: stg_jolpica__constructor_standings
    description: >
      One row per constructor per season: the final constructors' championship
      classification. Begins in 1958 -- the title did not exist for the first
      eight seasons of the world championship.
    columns:
      - name: season
        data_tests: [not_null]
      - name: constructor_id
        data_tests: [not_null]
      - name: championship_position
        description: >
          Final classification. Null where the entrant has no classified
          position: 211 rows where the constructor scored no points, and one
          2007 row where McLaren was excluded from the constructors'
          championship over the spying scandal, recorded as 'E'.
      - name: championship_position_text
        description: >
          Classification as published: a number, '-' for unclassified, or 'E'
          for an exclusion from the championship.
        data_tests: [not_null]
      - name: championship_points
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, constructor_id]

  - name: stg_jolpica__sprint_results
    description: >
      One row per driver per sprint race, 2021 onwards. Separate from
      stg_jolpica__results because a sprint is its own session with its own
      result; merging them would make it ambiguous how a driver finished.
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: driver_id
        data_tests: [not_null]
      - name: points
        description: Championship points awarded for the sprint.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, round, driver_id]
