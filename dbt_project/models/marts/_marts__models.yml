version: 2

# A star schema shaped for Power BI: four dimensions, four facts.
#
# Every foreign key carries a relationships test. In Power BI a fact row whose
# key is missing from its dimension doesn't error -- it quietly lands under a
# "(Blank)" member and skews every total it touches. These tests are what stop
# that happening unnoticed.

models:

  # ---------------------------------------------------------------- dimensions

  - name: dim_season
    description: >
      One row per championship season, 1950 to present. The hub for a season
      slicer: races reach it through dim_race, standings relate to it directly.
    columns:
      - name: season
        data_tests: [unique, not_null]
      - name: races_completed
        description: Rounds with results. Below races_scheduled mid-season.
      - name: is_dropped_scores_era
        description: >
          True up to 1990, when only a driver's best N results counted toward
          the title -- the seasons where championship and scored points differ.
        data_tests: [not_null]
      - name: is_current_season
        data_tests: [not_null]
      - name: title_margin
        description: >
          Champion's championship points minus the runner-up's, from the
          published standings. For an unfinished season, the leader's current
          margin.

  - name: dim_race
    description: >
      One row per race on the calendar, including current-season rounds not yet
      run. has_results separates the two.
    columns:
      - name: race_id
        description: >
          season * 100 + round, e.g. 202421. A single-column key because Power BI
          relationships cannot join on two columns.
        data_tests: [unique, not_null]
      - name: season
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_season')
                field: season
      - name: race_name
        data_tests: [not_null]
      - name: race_label
        description: >
          Round-prefixed race name, for example R01 Bahrain Grand Prix. Use this,
          not race_name, in slicers and axes. race_name repeats across seasons,
          so Power BI can't sort it by round or race_id; each race_label maps to
          exactly one round and sorts correctly as text.
        data_tests: [not_null]
      - name: race_date
        data_tests: [not_null]
      - name: has_results
        data_tests: [not_null]

  - name: dim_driver
    description: >
      One row per driver across their career. Attributes take their most recent
      value; code and permanent number take their most recent non-null value.
    columns:
      - name: driver_id
        data_tests: [unique, not_null]
      - name: driver_name
        data_tests: [not_null]
      - name: first_season
        data_tests: [not_null]

  - name: dim_constructor
    description: >
      One row per constructor. Built from race results rather than standings,
      because the constructors' title only began in 1958.
    columns:
      - name: constructor_id
        data_tests: [unique, not_null]
      - name: constructor_name
        data_tests: [not_null]
      - name: team_colour
        description: >
          Hex colour for conditional formatting, from the team_colours seed.
          Grey for teams before 1994, which the seed does not cover.
        data_tests: [not_null]
      - name: text_colour
        description: Black or white, whichever reads better on team_colour.
        data_tests: [not_null]

  # --------------------------------------------------------------------- facts

  - name: fct_race_results
    description: >
      One row per driver per car per race, 1950 to present. Keys and measures
      only; descriptive attributes live in the dimensions.
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: constructor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_constructor')
                field: constructor_id
      - name: was_classified
        data_tests: [not_null]
      - name: is_podium
        description: >
          A classified top-three finish. Checked against classification, not
          just position, so a retirement can never count.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [race_id, driver_id, car_number]

  - name: fct_points_by_round
    description: >
      One row per driver per race, race and sprint points combined, plus rolling
      and career form. The source for the points-progression chart -- a running
      sum over race results alone falls short from 2021 by every sprint point.
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: total_points
        description: race_points + sprint_points.
        data_tests: [not_null]
      - name: points_in_previous_5_races
        description: >
          Excludes the current race. The only form column safe for prediction;
          points_last_5_races includes the race and leaks its result.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [race_id, driver_id]

  - name: fct_driver_standings
    description: >
      Final drivers' standings, one row per driver per season, widened with the
      season's statistics. championship_points (as published) and points_scored
      (races plus sprints) sit side by side, with points_dropped between them.
    columns:
      - name: season
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_season')
                field: season
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: championship_points
        data_tests: [not_null]
      - name: is_champion
        description: >
          True only for the final classification leader of a finished season.
          False, never null, for everyone else -- including the current
          season's leader, and Schumacher, disqualified from the 1997
          championship.
        data_tests: [not_null]
      - name: poles
        description: >
          Starts from grid slot 1. Grid data covers every season, qualifying
          only from 1994. Can differ from the qualifying pole after a grid
          penalty.
      - name: modern_points
        description: >
          The season's race results rescored with the 25-18-15-12-10-8-6-4-2-1
          system, for comparing seasons across eras. Not the points awarded.
      - name: points_dropped
        description: >
          championship_points minus points_scored. Zero from 1991; negative
          before that where a driver's worst results were discarded.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, driver_id]

  - name: fct_driver_careers
    description: >
      One row per driver across their career: totals, rates, an era-adjusted
      score and age records. Totals favour modern drivers with longer seasons,
      so each total sits next to a rate.
    columns:
      - name: driver_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: starts
        description: Grands Prix started. A shared drive counts once.
        data_tests: [not_null]
      - name: poles
        description: >
          Starts from grid slot 1. Grid data covers every season, qualifying
          only from 1994, so this is the pole count that works across history.
      - name: titles
        description: Drivers' championships. Only finished seasons have a champion.
        data_tests: [not_null]
      - name: win_rate
        description: Wins divided by starts, as a fraction.
      - name: modern_points_per_start
        description: >
          The era-adjusted score. Every result rescored with the
          25-18-15-12-10-8-6-4-2-1 system for a classified top ten, divided by
          starts. Removes points-system changes and season length, not the car.
        data_tests: [not_null]
      - name: age_first_win
        description: Age at first win, formatted like 18y 228d. The _days columns hold the same ages for sorting.

  - name: fct_driver_streaks
    description: >
      One row per unbroken run of wins, podiums or points finishes. Streaks
      run over a driver's consecutive starts, not calendar races, so a missed
      race does not break one.
    columns:
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: streak_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [win, podium, points]
      - name: streak_length
        data_tests: [not_null]
      - name: streak_rank
        description: >
          Rank by length within the streak type, 1 for the longest. Ties share a
          rank. Filter on it for a top-ten table: Power BI's Top N filter would
          merge a driver's separate streaks into one row.
        data_tests: [not_null]
      - name: runs_to_latest_start
        description: >
          True when the streak includes the driver's most recent start, so it
          may still be growing.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [driver_id, streak_type, first_race_id]

  - name: fct_lap_positions
    description: >
      One row per driver per lap, 1996 to present. Lap 0 is the starting grid,
      so a position chart starts where each driver lined up.
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: lap
        description: Lap number. 0 is the starting grid.
        data_tests: [not_null]
      - name: position
        description: Running position at the end of the lap, or grid slot on lap 0.
        data_tests: [not_null]
      - name: is_pit_lap
        description: >
          The driver pitted on this lap. Always false before 2011, when pit
          stop data begins.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [race_id, driver_id, lap]

  - name: fct_pit_stops
    description: One row per pit stop, 2011 to present.
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: duration_seconds
        description: >
          Time in the pit lane, entry to exit, in seconds. Not just stationary
          time; a red-flag or repair stop can run past a minute.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [race_id, driver_id, stop_number]

  - name: fct_teammate_qualifying
    description: >
      One row per driver per qualifying session, compared with their teammate,
      1994 to present. Each pair appears twice, once from each side. Summarise
      gap_pct with a median: one crash or red flag in a session can put a
      driver several percent down and would drag an average.
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: constructor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_constructor')
                field: constructor_id
      - name: teammate_name
        description: >
          Carried on the fact because a second relationship from teammate_id to
          dim_driver would have to be inactive in Power BI.
        data_tests: [not_null]
      - name: gap_pct
        description: >
          Driver lap minus teammate lap as a percentage of the faster lap, in the
          last session both set a time in. Negative means the driver was faster.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [race_id, driver_id]
